name: CI

on:
  push:
  pull_request:

jobs:
  swift-test:
    # ローカルの開発環境(macOS 26)と SDK 世代を揃える
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: swift build
      - name: Test
        # 画面を使うテストはCIのランナーで不安定なため手元で走らせる。
        run: swift test --filter UtsushieCoreTests
      # 署名検証付きの build_release.sh はリリース時のみ。
      # CI では ad-hoc 署名でアプリバンドルの組み立てまでを検証する
      - name: Build app bundle
        run: ./scripts/make-app.sh release
